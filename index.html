<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Следующий тур</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%232F5D8A%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#15202B; --muted:#5E6C79; --line:#D8DEE5;
  --bar:#2F5D8A; --bar-hi:#1D3F63; --bar-lo:#B3C6DA; --thr:#15202B; --zero:#B7C3CF; --star:#D99A00; --live:#1B8F4F; --win:#1B8F4F; --draw:#8A96A3; --loss:#C9443A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --surface:#151F29; --surface-2:#1B2733; --ink:#E4EBF1; --muted:#8D9CAA; --line:#26343F;
    --bar:#5E95CF; --bar-hi:#8DB6E2; --bar-lo:#34506B; --thr:#E4EBF1; --zero:#3A4A58; --star:#F2B924; --live:#34C074; --win:#34C074; --draw:#7D8A97; --loss:#E8665C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --surface-2:#1B2733; --ink:#E4EBF1; --muted:#8D9CAA; --line:#26343F;
  --bar:#5E95CF; --bar-hi:#8DB6E2; --bar-lo:#34506B; --thr:#E4EBF1; --zero:#3A4A58; --star:#F2B924; --live:#34C074; --win:#34C074; --draw:#7D8A97; --loss:#E8665C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bar);outline-offset:2px;border-radius:4px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:16px;padding:14px 0 10px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.01em;text-decoration:none;white-space:nowrap}
.search{position:relative;flex:1;max-width:340px;margin-left:auto}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);overflow:hidden;max-height:360px;overflow-y:auto}
.results a{display:flex;align-items:center;gap:10px;padding:8px 12px;text-decoration:none}
.results a:hover,.results a.sel{background:var(--surface-2)}
.results small{color:var(--muted);margin-left:auto;font-size:13px}
.results .none{padding:10px 12px;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px}
.tabs a{padding:8px 14px 10px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent}
.tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .count[hidden]{display:none}
.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--star);color:#1a1300;font-size:12px;font-weight:600;text-align:center}

main{padding:20px 0 48px}

/* tournaments */
.comp{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;position:relative}
.comp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.comp-head{all:unset;box-sizing:border-box;display:flex;align-items:center;width:100%;padding:14px 18px 14px 24px;cursor:pointer}
.comp-head:focus-visible{outline:2px solid var(--bar);outline-offset:-2px}
.comp-name{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1}
.chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.comp.open .chev{transform:rotate(180deg)}
.comp-body{padding:0 12px 10px 18px}
.day{font-size:14px;font-weight:600;color:var(--muted);padding:12px 6px 6px}
.day:first-child{padding-top:2px}
.empty-note{color:var(--muted);padding:6px 6px 12px;font-size:15px}

.match{display:grid;grid-template-columns:78px 1fr 18px 1fr 40px;align-items:center;gap:8px;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.day + .match{border-top:none}
.match:hover{background:var(--surface-2)}
.when{display:flex;flex-direction:column;line-height:1.15}
.time{font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.when small{font-size:12px;color:var(--muted)}
.live{display:inline-block;align-self:flex-start;margin-top:3px;padding:1px 7px;border-radius:4px;background:var(--live);color:#fff;font-size:12px;font-weight:600}
.side{display:flex;align-items:center;gap:9px;min-width:0}
.side.home{justify-content:flex-end;text-align:right}
.tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.vs{color:var(--muted);text-align:center}
.crest{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--tc);color:#fff;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.02em;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.crest.lg{width:56px;height:56px;font-size:22px}
.crest{position:relative;overflow:hidden}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;opacity:0;background:var(--surface)}
.crest img.ok{opacity:1}
.crest:has(img.ok){box-shadow:none}
.star{all:unset;display:grid;place-items:center;width:36px;height:36px;border-radius:8px;cursor:pointer;color:var(--muted)}
.star:hover{background:var(--surface-2);color:var(--ink)}
.star:focus-visible{outline:2px solid var(--bar)}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] path{fill:currentColor}

.fav-empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:32px 24px;text-align:center;color:var(--muted)}
.fav-empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

@media (max-width:600px){
  .match{grid-template-columns:62px 1fr 40px;grid-template-areas:"w h s" "w a s";row-gap:4px}
  .when{grid-area:w}.side.home{grid-area:h;justify-content:flex-start;text-align:left;flex-direction:row-reverse}.side.away{grid-area:a}.vs{display:none}.star{grid-area:s}
  .brand{font-size:23px}
}

/* pages */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:14px;cursor:pointer;background:none;border:0;padding:4px 0}
.back:hover{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0 0 12px;line-height:1.1}
h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0;line-height:1.1}
.muted{color:var(--muted)}

.mhead{position:relative;overflow:hidden}
.mhead::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.mmeta{color:var(--muted);font-size:15px;margin:4px 0 16px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.mmeta b{color:var(--ink);font-weight:600}
.mteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.mteam{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;text-decoration:none;padding:8px;border-radius:8px}
.mteam:hover{background:var(--surface-2)}
.mteam .nm{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1}
.mteam small{color:var(--muted);font-size:14px}
.mvs{font-family:var(--display);font-size:28px;color:var(--muted)}
.mactions{display:flex;justify-content:center;margin-top:14px}
.fav-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500}
.fav-btn[aria-pressed="true"]{border-color:var(--star);color:var(--ink)}
.fav-btn[aria-pressed="true"] svg{color:var(--star)}
.fav-btn[aria-pressed="true"] path{fill:currentColor}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.sm button{padding:3px 9px;font-size:13px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{margin:0}

.cmp{width:100%;border-collapse:collapse}
.cmp td{padding:7px 0;border-top:1px solid var(--line);vertical-align:middle}
.cmp tr:first-child td{border-top:none}
.cmp .v{width:52px;font-variant-numeric:tabular-nums;font-weight:600}
.cmp .v.l{text-align:left;padding-left:8px}.cmp .v.r{text-align:right;padding-right:8px}
.cmp .lbl{text-align:center;color:var(--muted);font-size:14px;width:150px}
.cmp .bw{width:30%}
.track{height:8px;background:var(--surface-2);border-radius:4px;display:flex}
.track.rtl{justify-content:flex-end}
.fill{height:100%;border-radius:4px;background:var(--bar)}
.fill.alt{background:var(--draw)}
.cmp-note{font-size:14px;color:var(--muted);margin-top:10px}
.cmp-head{display:grid;grid-template-columns:1fr 1fr;font-weight:600;margin-bottom:6px;font-size:15px}
.cmp-head span:last-child{text-align:right}
@media (max-width:600px){.cmp .lbl{width:110px;font-size:13px}.cmp .bw{width:22%}}

.h2h a{display:grid;grid-template-columns:90px 1fr auto 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);text-decoration:none}
.h2h a:first-child{border-top:none}
.h2h .sc{font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.h2h .r{text-align:right}

.thead{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.thead h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0}
.thead p{margin:4px 0 0;color:var(--muted)}
.filter-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 14px}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;padding:0}
.summary > div{padding:14px 18px;border-left:1px solid var(--line)}
.summary > div:first-child{border-left:none}
.summary .k{font-size:14px;color:var(--muted)}
.summary .val{font-family:var(--display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:4px;margin-top:4px}
.chip{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;color:#fff;font-weight:600;font-size:13px}
.chip.w{background:var(--win)}.chip.d{background:var(--draw)}.chip.l{background:var(--loss)}
@media (max-width:600px){.summary > div{border-left:none;border-top:1px solid var(--line)}.summary > div:first-child{border-top:none}}

.hint{font-size:14px;color:var(--muted);margin:0 0 10px}
.chart-card{padding:0 16px 12px}
.mtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 12px;border-bottom:1px solid var(--line)}
.mtabs::-webkit-scrollbar{display:none}
.mtabs button{flex:none;border:0;background:none;padding:13px 10px 11px;cursor:pointer;color:var(--muted);font-weight:500;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.mtabs button:hover{color:var(--ink)}
.mtabs button.on{color:var(--ink);border-bottom-color:var(--bar)}
.ch-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chart-host{position:relative}
.plot{height:210px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.plot.drag{cursor:grabbing}
.plot svg{display:block}
.plot .grid{stroke:var(--line);stroke-width:1}
.plot .ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.plot rect.b{fill:var(--bar)}
.plot rect.b.hi{fill:var(--bar-hi)}
.plot rect.z{fill:var(--zero)}
.plot rect.b.lo{fill:var(--bar-lo)}
.plot rect.b.lo.hi{fill:var(--bar)}
.plot .thr{stroke:var(--thr);stroke-width:1.5;opacity:.75}
.plot .thrt{fill:var(--thr);font-size:12px;font-weight:600;font-family:var(--body);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.plot .avg{stroke:var(--star);stroke-width:1.5;stroke-dasharray:5 4}
.plot .avgt{fill:var(--star);font-size:12px;font-weight:600;font-family:var(--body);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.plot .empty{margin:0;height:100%;display:grid;place-items:center;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 10px;border-radius:6px;font-size:13px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);z-index:5}
.tip b{font-weight:600}
.ch-foot{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--muted);min-height:32px}
.hitrate{color:var(--ink);font-size:15px}
.hitrate b{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.linectl{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:30px;height:28px;cursor:pointer;font-size:17px;line-height:1;color:var(--ink)}
.stepper button:hover{background:var(--surface-2)}
.stepper output{min-width:42px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:28px}
@media (max-width:600px){.linectl{margin-left:0}}
.reset{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
.reset:hover{background:var(--surface-2)}

.mlist{width:100%;border-collapse:collapse;font-size:15px}
.mlist th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:0 8px 6px 0}
.mlist td{padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:middle}
.mlist .sc{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.mlist .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mlist th.num{text-align:right}
.mv{display:inline-block;min-width:22px;padding:1px 6px;border-radius:5px;text-align:center;font-weight:600}
.mv.hot{background:var(--bar);color:#fff}
.mlist a{text-decoration:none}.mlist a:hover{text-decoration:underline}
.tbl-wrap{overflow-x:auto}
.demo{font-size:13px;color:var(--muted);text-align:center;margin-top:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row">
      <a class="brand" href="#/">Следующий тур</a>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Найти команду" autocomplete="off" aria-label="Найти команду">
        <div class="results" id="results" hidden></div>
      </div>
    </div>
    <nav class="tabs">
      <a href="#/" data-tab="list">Турниры</a>
      <a href="#/fav" data-tab="fav">Избранное<span class="count" id="favCount" hidden></span></a>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const MIN=6e4, HOUR=36e5, DAY=864e5, MATCH_LEN=115*MIN;
let NOW=Date.now();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(v,d=1)=>v.toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});
const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const timeStr=t=>new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
const dayStr=t=>{const s=new Date(t).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});return s[0].toUpperCase()+s.slice(1)};
const shortDate=t=>new Date(t).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()};
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<12||m100>14))return b;return c}
const STAR='<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.1 1.1 5.9L12 16.6l-5.3 2.9 1.1-5.9-4.4-4.1 6-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
const BACK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';

/* ---------- data (загружается из data/*.json) ---------- */
const COLORS={pl:"#6A2C91",ll:"#E0453A",sa:"#1B7FC4",bl:"#C8102E",l1:"#3A5BA9",cl:"#2E4BB8",el:"#F28C00"};
let COMPS={},ORDER=[],TEAMS={},MATCHES=[],UPCOMING={},MBYID={},STANDINGS={},UPDATED=null;
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function initials(name){
  const skip=new Set(["FC","AC","AS","SC","VfL","VfB","TSG","FSV","RB","CP","FK","FF","1."]);
  const w=name.replace(/[^\p{L}\s]/gu," ").split(/\s+/).filter(x=>x&&!skip.has(x));
  return ((w[0]||"")[0]+((w[1]||"")[0]||(w[0]||"")[1]||"")).toUpperCase();
}
function side(s){
  if(!s)return{};
  const t=k=>s[k]||[null,null,null];
  const [g,g1,g2]=t("g"),[xg,xg1,xg2]=t("xg"),[sot,sot1,sot2]=t("sot"),[c,c1,c2]=t("c"),[y,y1,y2]=t("y"),[f,f1,f2]=t("f"),[o,o1,o2]=t("o"),[pos,pos1,pos2]=t("pos");
  return{g,g1,g2,xg,xg1,xg2,sot,sot1,sot2,c,c1,c2,y,y1,y2,f,f1,f2,o,o1,o2,pos,pos1,pos2};
}
function roundLabel(code,r){if(!r)return"";if(/^\d+$/.test(r))return code==="cl"||code==="el"?r+"-й игровой день":r+"-й тур";return r}
async function load(){
  const bust="?v="+Math.floor(Date.now()/6e5);
  const [meta,db]=await Promise.all([fetch("data/meta.json"+bust).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}),fetch("data/matches.json"+bust).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})]);
  UPDATED=meta.updated;ORDER=meta.order;
  for(const c in meta.comps)COMPS[c]={name:meta.comps[c],color:COLORS[c]||"#888"};
  const leagueOf={};

  for(const id in meta.teams){const t=meta.teams[id];TEAMS[id]={id,name:t.name,league:leagueOf[id]||null,color:`hsl(${hash(t.name)%360} 45% 40%)`,ini:initials(t.name)}}
  for(const c in meta.standings){STANDINGS[c]={};for(const id in meta.standings[c]){const[pos,pts,pl]=meta.standings[c][id];STANDINGS[c][id]={pos,pts,played:pl}}}
  MATCHES=db.matches.filter(m=>TEAMS[m.h]&&TEAMS[m.a]).map(m=>{
    const st=m.s?{h:side(m.s.h),a:side(m.s.a)}:{h:{g:m.score?m.score[0]:null},a:{g:m.score?m.score[1]:null}};

  MBYID=Object.fromEntries([...MATCHES,...Object.values(UPCOMING).flat()].map(m=>[m.id,m]));
  ALL=Object.values(TEAMS).sort((a,b)=>a.name.localeCompare(b.name));
}

/* ---------- bar chart ---------- */
class BarChart{
  constructor(host,opts){
    this.opts=opts;this.data=[];this.s=0;this.e=0;this.drag=null;
    host.innerHTML='<div class="plot"></div><div class="tip" hidden></div>';
    this.plot=host.querySelector(".plot");this.tip=host.querySelector(".tip");this.host=host;
    const p=this.plot;
    p.addEventListener("wheel",e=>{
      const n=this.data.length;if(n<=3)return;e.preventDefault();
      const span=this.e-this.s;
      if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){this.pan(e.deltaX/this.plotW*span);return}
      const r=p.getBoundingClientRect();const frac=clamp((e.clientX-r.left-this.PL)/this.plotW,0,1);
      const c=this.s+frac*span;const ns=clamp(span*(e.deltaY>0?1.2:1/1.2),Math.min(3,n),n);
      this.s=clamp(c-frac*ns,0,n-ns);this.e=this.s+ns;this.hideTip();this.draw();
    },{passive:false});
    p.addEventListener("pointerdown",e=>{if(e.button!==0||this.e-this.s>=this.data.length)return;this.drag={x:e.clientX,s:this.s};p.setPointerCapture(e.pointerId);p.classList.add("drag");this.hideTip()});
    p.addEventListener("pointermove",e=>{
      if(this.drag){const span=this.e-this.s;const ns=clamp(this.drag.s-(e.clientX-this.drag.x)/this.plotW*span,0,this.data.length-span);this.s=ns;this.e=ns+span;this.draw();return}
      this.hover(e);
    });
    const end=()=>{this.drag=null;p.classList.remove("drag")};
    p.addEventListener("pointerup",end);p.addEventListener("pointercancel",end);
    p.addEventListener("pointerleave",()=>this.hideTip());
    new ResizeObserver(()=>this.draw()).observe(p);
  }
  pan(d){const span=this.e-this.s;this.s=clamp(this.s+d,0,this.data.length-span);this.e=this.s+span;this.draw()}
  setLine(v){this.line=v;this.draw()}
  setData(data,keep){this.data=data;const n=data.length;if(!keep||this.e>n){this.s=0;this.e=n}this.hideTip();this.draw()}
  reset(){this.s=0;this.e=this.data.length;this.draw()}
  hideTip(){this.tip.hidden=true;const h=this.plot.querySelector("rect.hi");if(h)h.classList.remove("hi")}
  hover(e){
    const n=this.data.length;if(!n)return;
    const r=this.plot.getBoundingClientRect();const x=e.clientX-r.left;
    const i=Math.floor(this.s+(x-this.PL)/this.plotW*(this.e-this.s));
    if(x<this.PL||i<0||i>=n){this.hideTip();return}
    const prev=this.plot.querySelector("rect.hi");if(prev)prev.classList.remove("hi");
    const rect=this.plot.querySelector(`rect[data-i="${i}"]`);if(rect)rect.classList.add("hi");
    const d=this.data[i];const cx=this.PL+(i+.5-this.s)*this.unit;
    this.tip.innerHTML=d.tip;this.tip.hidden=false;
    const tw=this.tip.offsetWidth;const W=this.plot.clientWidth;
    this.tip.style.left=clamp(cx,tw/2,W-tw/2)+"px";this.tip.style.top=(this.y(d.v)-8)+"px";
  }
  draw(){
    const p=this.plot,W=p.clientWidth||600,H=210,PL=34,PR=10,PT=14,PB=26;
    this.PL=PL;this.plotW=W-PL-PR;const plotH=H-PT-PB;const n=this.data.length;
    if(!n){p.innerHTML='<p class="empty">Нет матчей за этот период</p>';this.opts.onView&&this.opts.onView(false);return}
    const dec=this.opts.decimals;const vals=this.data.map(d=>d.v);const av=vals.reduce((a,b)=>a+b,0)/n;
    const mx=Math.max(...vals,av,this.line==null?0:this.line+.5);let ymax,step;const U=this.opts.unit||"";
    if(this.opts.max){ymax=this.opts.max;step=this.opts.max/4}
    else if(dec){ymax=Math.max(1,Math.ceil(mx*2)/2);step=ymax<=2?.5:1;ymax=Math.ceil(ymax/step)*step}
    else{ymax=Math.max(2,Math.ceil(mx));step=ymax<=6?1:ymax<=12?2:5;ymax=Math.ceil(ymax/step)*step}
    const y=v=>PT+plotH-v/ymax*plotH;this.y=y;const L=this.line;
    const span=this.e-this.s,unit=this.plotW/span;this.unit=unit;const bw=clamp(unit*.6,3,30);
    const cid="c"+Math.random().toString(36).slice(2,8);
    let g="";
    for(let v=0;v<=ymax+1e-9;v+=step){g+=`<line class="grid" x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${PL-6}" y="${y(v)+4}" text-anchor="end">${dec?fmt(v,v%1?1:0):v}${U}</text>`}
    let bars="",labels="";const k=Math.max(1,Math.ceil(46/unit));
    const i0=Math.max(0,Math.floor(this.s)-1),i1=Math.min(n-1,Math.ceil(this.e));
    for(let i=i0;i<=i1;i++){
      const cx=PL+(i+.5-this.s)*unit,v=this.data[i].v;
      const lo=L!=null&&v<=L?" lo":"";
      bars+=v>0?`<rect class="b${lo}" data-i="${i}" x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="2"/>`:`<rect class="b z" data-i="${i}" x="${cx-bw/2}" y="${y(0)-2}" width="${bw}" height="2"/>`;
      if(i%k===0&&cx>=PL-2&&cx<=W-PR+2)labels+=`<text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${shortDate(this.data[i].t)}</text>`;
    }
    const ay=y(av);const ty=L==null?null:y(Math.min(L,ymax));
    p.innerHTML=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(this.opts.title)}"><defs><clipPath id="${cid}"><rect x="${PL}" y="0" width="${this.plotW}" height="${H}"/></clipPath></defs>
      ${g}<g clip-path="url(#${cid})">${bars}</g>${labels}
      <line class="avg" x1="${PL}" x2="${W-PR}" y1="${ay}" y2="${ay}"/><text class="avgt" x="${W-PR-2}" y="${ay-5}" text-anchor="end">ср. ${fmt(av,this.opts.avgDec??(dec?2:1))}${U}</text>
      ${L!=null?`<line class="thr" x1="${PL}" x2="${W-PR}" y1="${ty}" y2="${ty}"/><text class="thrt" x="${PL+4}" y="${ty-5}">${fmt(L,L%1?1:0)}${U}</text>`:""}</svg>`;
    this.opts.onView&&this.opts.onView(span<n-1e-6,av,L==null?0:vals.filter(v=>v>L).length,n);
  }
}

  main.innerHTML=`<button class="back" data-back>${BACK}Назад</button>
  <div class="thead">${crest(id,1)}<div><h1>${tname(id)}</h1><p>${esc(comps.join(", "))}</p></div></div>
  <div class="filter-row">${seg("per",PERIODS,period)}${seg("tf",[["all","Все"],["home","Дома"],["away","В гостях"]],tFilter)}<span class="muted">${rows.length} ${plural(rows.length,"матч","матча","матчей")} ${periodLbl()}</span></div>
  <div class="panel summary">
    <div><div class="k">Победы, ничьи, поражения</div><div class="val">${w} – ${d} – ${l}</div></div>
    <div><div class="k">Последние матчи</div><div class="chips">${last5.length?last5.map(r=>`<span class="chip ${r.res}" title="${esc(TEAMS[r.oppId].name)} ${r.gf}:${r.ga}">${RL[r.res]}</span>`).join(""):"–"}</div></div>
    ${tile("Владение",r=>r.own.pos,0,"%")}
  </div>
  <div class="panel chart-card" data-chart="${c.key}">
    <div class="mtabs" role="tablist" aria-label="Показатель">${CHARTS.map(x=>`<button role="tab" data-metric="${x.key}" aria-selected="${x.key===c.key}" class="${x.key===c.key?"on":""}">${x.tab}</button>`).join("")}</div>
    <div class="ch-head"><h3>${c.title}</h3>${c.halves?seg("half-"+c.key,[["m","Матч"],["1","1-й тайм"],["2","2-й тайм"]],tHalf[c.key]||"m",1):""}</div>
    <div class="chart-host"></div>
    <div class="ch-foot"><span class="hitrate"></span><span class="linectl">Линия<span class="stepper"><button data-line="${c.key}" data-d="-1" aria-label="Опустить линию">−</button><output></output><button data-line="${c.key}" data-d="1" aria-label="Поднять линию">+</button></span></span><button class="reset" data-reset="${c.key}" hidden>Сбросить масштаб</button></div>
  </div>
  <p class="hint">Значения за матч. Колёсико мыши меняет масштаб графика, перетаскивание сдвигает по датам. Сплошную линию двигают кнопки «−» и «+»: столбики выше неё выделены цветом.</p>
  <div class="panel" id="mlist"></div>`;
  charts={};
  const card=main.querySelector(".chart-card");
  const resetBtn=card.querySelector(".reset"),hit=card.querySelector(".hitrate"),out=card.querySelector("output");
  const U=c.unit||"";
  const ch=new BarChart(card.querySelector(".chart-host"),{title:c.title,decimals:c.decimals,unit:c.unit,max:c.max,avgDec:c.avgDec,onView:(z,av,above,n)=>{
    resetBtn.hidden=!z;const L=ch.line;out.textContent=L==null?"–":fmt(L,L%1?1:0)+U;
    hit.innerHTML=n?`Больше ${fmt(L,L%1?1:0)}${U}: <b>${above} из ${n}</b> (${Math.round(above/n*100)}%)`:"";
  }});
  charts[c.key]={ch,c,rows};applyChart(c.key,false);renderMList();
  const on=card.querySelector(".mtabs .on");if(on)on.scrollIntoView({block:"nearest",inline:"nearest"});
}

function renderMList(){
  const box=document.getElementById("mlist");if(!box)return;
  const o=Object.values(charts)[0];if(!o)return;
  const {c,rows}=o,h=tHalf[c.key]||"m",L=tLine[lineKey(c)],U=c.unit||"",RL={w:"В",d:"Н",l:"П"};
  const f=v=>v==null?"–":(c.decimals?fmt(v,2):v)+U;
  const half=HALF_LBL[h]?`, ${h}-й тайм`:"";
  const list=rows.slice().reverse();
  if(!list.length){box.innerHTML='<h2>Матчи за период</h2><p class="muted" style="margin:0">Нет матчей за этот период.</p>';return}
  const above=list.filter(r=>{const v=c.get(r,h);return v!=null&&L!=null&&v>L}).length,known=list.filter(r=>c.get(r,h)!=null).length;
  box.innerHTML=`<div class="sec-head"><h2>${esc(c.col)} по матчам${half}</h2>${known&&L!=null?`<span class="muted">выше линии ${fmt(L,L%1?1:0)}${U}: ${above} из ${known}</span>`:""}</div>
  <div class="tbl-wrap"><table class="mlist"><thead><tr><th>Дата</th><th>Турнир</th><th>Соперник</th><th></th><th class="num">${c.oppFirst?"Забито : пропущено":"Команда : соперник"}</th>${c.noSum?"":'<th class="num">Всего</th>'}${c.noScore?"":'<th class="num">Счёт</th>'}</tr></thead><tbody>
  ${list.map(r=>{const v=c.get(r,h),w=c.other(r,h);const hot=v!=null&&L!=null&&v>L;
    const cell=x=>`<span class="mv${hot?" hot":""}">${f(x)}</span>`;
    const pair=c.oppFirst?`${f(w)} : ${cell(v)}`:`${cell(v)} : ${f(w)}`;
    const sum=v!=null&&w!=null?(c.decimals?fmt(v+w,2):v+w):"–";
    return`<tr><td>${shortDate(r.m.ko)}</td><td class="muted">${esc(COMPS[r.m.comp].name)}</td><td><a href="#/team/${r.oppId}">${tname(r.oppId)}</a></td><td class="muted">${r.home?"дома":"в гостях"}</td>
    <td class="sc num"><a href="#/match/${r.m.id}">${pair}</a>${c.noScore?` <span class="chip ${r.res}" style="width:22px;height:22px;font-size:12px;margin-left:4px">${RL[r.res]}</span>`:""}</td>
    ${c.noSum?"":`<td class="num">${sum}</td>`}
    ${c.noScore?"":`<td class="num muted">${r.gf}:${r.ga} <span class="chip ${r.res}" style="width:22px;height:22px;font-size:12px;margin-left:4px">${RL[r.res]}</span></td>`}</tr>`}).join("")}
  </tbody></table></div>`;
}
const lineKey=c=>c.key+(tHalf[c.key]||"m");
function applyChart(key,keep){
  const o=charts[key],data=chartData(o.c,o.rows),lk=lineKey(o.c);
  if(tLine[lk]==null){const av=data.length?data.reduce((a,d)=>a+d.v,0)/data.length:0;tLine[lk]=o.c.step===5?Math.round(av/5)*5:Math.floor(av)+0.5}
  o.ch.line=tLine[lk];o.ch.setData(data,keep);
}
/* ---------- router ---------- */
let route="";
function render(){
  const h=location.hash||"#/";route=h;
  document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",(a.dataset.tab==="fav"&&h==="#/fav")||(a.dataset.tab==="list"&&(h==="#/"||h==="#"))));
  updateFavCount();
  let mm;
  if(h==="#/fav")renderFav();
  else if(mm=h.match(/^#\/match\/(.+)$/))renderMatch(mm[1]);
  else if(mm=h.match(/^#\/team\/(.+)$/))renderTeam(mm[1]);
  else renderList();
}
let lastRoute="";
window.addEventListener("hashchange",()=>{render();if(route!==lastRoute)window.scrollTo(0,0);lastRoute=route});
setInterval(()=>{if(!/^#\/team\//.test(location.hash))render()},30000);

/* ---------- events ---------- */
main.addEventListener("click",e=>{
  const star=e.target.closest("[data-star]");
  if(star){e.stopPropagation();toggleFav(star.dataset.star);if(route==="#/fav"){renderFav()}else if(/^#\/match\//.test(route)){renderMatch(route.split("/")[2])}else{star.setAttribute("aria-pressed",favs.includes(star.dataset.star))}return}
  const tg=e.target.closest("[data-toggle]");
  if(tg){const c=tg.dataset.toggle;openComps.has(c)?openComps.delete(c):openComps.add(c);renderList();main.querySelector(`[data-toggle="${c}"]`).focus();return}
  const row=e.target.closest("[data-match]");
  if(row){location.hash="#/match/"+row.dataset.match;return}
  if(e.target.closest("[data-back]")){if(history.length>1)history.back();else location.hash="#/";return}
  const s=e.target.closest("[data-seg]");
  if(s){const name=s.dataset.seg,v=s.dataset.val;
    if(name==="mf"){mFilter=v;renderMatch(route.split("/")[2])}
    else if(name==="tf"){tFilter=v;const y=window.scrollY;renderTeam(route.split("/")[2]);window.scrollTo(0,y)}
    else if(name==="per"){period=v;try{localStorage.setItem("period",v)}catch(e){}const y=window.scrollY;if(/^#\/team\//.test(route))renderTeam(route.split("/")[2]);else renderMatch(route.split("/")[2]);window.scrollTo(0,y)}
    else if(name.startsWith("half-")){const k=name.slice(5);tHalf[k]=v;applyChart(k,true);renderMList();
      s.parentElement.querySelectorAll("button").forEach(b=>{b.classList.toggle("on",b===s);b.setAttribute("aria-pressed",b===s)})}
    return}
  const lb=e.target.closest("[data-line]");
  if(lb){const o=charts[lb.dataset.line],lk=lineKey(o.c),step=o.c.step||1;
    tLine[lk]=clamp(Math.round((tLine[lk]+Number(lb.dataset.d)*step)*2)/2,step===5?5:0.5,o.c.max?o.c.max-5:99);o.ch.setLine(tLine[lk]);renderMList();return}
  const mt=e.target.closest("[data-metric]");
  if(mt){tMetric=mt.dataset.metric;try{localStorage.setItem("metric",tMetric)}catch(e){}const y=window.scrollY;renderTeam(route.split("/")[2]);window.scrollTo(0,y);main.querySelector(`[data-metric="${tMetric}"]`).focus({preventScroll:true});return}
  const rs=e.target.closest("[data-reset]");
  if(rs){charts[rs.dataset.reset].ch.reset();return}
});
main.addEventListener("keydown",e=>{const row=e.target.closest(".match");if(row&&e.target===row&&(e.key==="Enter"||e.key===" ")){e.preventDefault();location.hash="#/match/"+row.dataset.match}});

/* search */
const q=document.getElementById("q"),res=document.getElementById("results");
let ALL=[];
let hits=[],sel=0;
function drawResults(){
  const s=norm(q.value.trim());
  if(!s){res.hidden=true;return}
  hits=ALL.filter(t=>norm(t.name).includes(s)).slice(0,8);sel=0;
  res.innerHTML=hits.length?hits.map((t,i)=>`<a href="#/team/${t.id}" class="${i===sel?"sel":""}">${crest(t.id)}<span>${esc(t.name)}</span><small>${t.league?esc(COMPS[t.league].name):""}</small></a>`).join(""):'<div class="none">Команда не найдена</div>';
  res.hidden=false;
}
q.addEventListener("input",drawResults);
q.addEventListener("focus",drawResults);
q.addEventListener("keydown",e=>{
  if(e.key==="Escape"){res.hidden=true;q.blur()}
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){if(!hits.length)return;e.preventDefault();sel=(sel+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length;res.querySelectorAll("a").forEach((a,i)=>a.classList.toggle("sel",i===sel))}
  else if(e.key==="Enter"&&hits[sel]){location.hash="#/team/"+hits[sel].id;q.value="";res.hidden=true;q.blur()}
});
res.addEventListener("click",()=>{q.value="";res.hidden=true});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.hidden=true});

lastRoute=location.hash||"#/";
main.innerHTML='<p class="muted">Загружаю данные…</p>';
load().then(render).catch(e=>{main.innerHTML=`<div class="fav-empty"><b>Не удалось загрузить данные</b>Обнови страницу через минуту. Если не помогает, данные ещё не собраны: подожди ближайшего обновления. (${esc(e.message)})</div>`});
})();
</script>
</body>
</html>
