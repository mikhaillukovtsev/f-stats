name: Проверка доступа к API

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/check_access.py
      - .github/workflows/check-access.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить ключ и сезон
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/check_access.py
