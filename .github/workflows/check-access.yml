name: Проверка доступа к API

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/check_access.py
      - .github/workflows/check-access.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить ключ и сезон
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/check_access.py
      - name: Сохранить результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add check_result.txt
          git commit -m "Результат проверки доступа" || exit 0
          git push
