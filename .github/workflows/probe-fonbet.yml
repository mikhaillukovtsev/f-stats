name: probe fonbet
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_fonbet.py
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p probe && python scripts/probe_fonbet.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe-data
          git add -f probe
          git commit -qm probe
          git push -f origin probe-data
