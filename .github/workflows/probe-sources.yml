name: Проверка бесплатных источников

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_sources.py
      - .github/workflows/probe-sources.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - name: Проверить источники
        continue-on-error: true
        run: python scripts/probe_sources.py
      - name: Сохранить результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_result.txt
          git commit -m "Результат проверки источников" || exit 0
          git pull --rebase -q
          git push
