name: Проверка коэффициентов
on:
  workflow_dispatch:
  push:
    paths: [scripts/probe_odds.py, .github/workflows/probe-odds.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/probe_odds.py
        continue-on-error: true
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "Результат проверки коэффициентов" || exit 0
          git pull --rebase -q && git push
